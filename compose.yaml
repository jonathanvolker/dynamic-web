services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forma
      POSTGRES_DB: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URI: postgresql://forma:${POSTGRES_PASSWORD}@db:5432/forma
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Definí PAYLOAD_SECRET en .env}
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN:?Definí DOMAIN en .env}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migration
    profiles: ["tools"]
    environment:
      DATABASE_URI: postgresql://forma:${POSTGRES_PASSWORD}@db:5432/forma
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
