services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forma
      POSTGRES_DB: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ${IMAGE_NAME:?Definí IMAGE_NAME en el .env}
    restart: unless-stopped
    environment:
      DATABASE_URI: postgresql://forma:${POSTGRES_PASSWORD}@db:5432/forma
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      PLATFORM_DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Definí PAYLOAD_SECRET en el .env}
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_URL:?Definí PUBLIC_URL en el .env}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      PLAN_INITIAL_PRICE_ARS: ${PLAN_INITIAL_PRICE_ARS:-6000}
      PLAN_PROFESSIONAL_PRICE_ARS: ${PLAN_PROFESSIONAL_PRICE_ARS:-19000}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_SANDBOX: ${MERCADOPAGO_SANDBOX:-false}
      FORMA_CNAME_TARGET: ${FORMA_CNAME_TARGET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    volumes:
      - forma_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Definí DOMAIN en el .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  migrate:
    image: ${IMAGE_NAME:?Definí IMAGE_NAME en el .env}
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://forma:${POSTGRES_PASSWORD}@db:5432/forma
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Definí PAYLOAD_SECRET en el .env}
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_URL:?Definí PUBLIC_URL en el .env}
    command: ["sh", "-c", "npm run migrate:platform && npm run migrate"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  forma_data:
  caddy_data:
  caddy_config:
