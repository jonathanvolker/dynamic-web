name: Build And Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dynamic-web

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  image:
    name: Publish container image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:migration-main
            ${{ env.IMAGE_NAME }}:migration-sha-${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Copy deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -o IdentitiesOnly=yes -i ~/.ssh/deploy_key deploy/compose.production.yaml Caddyfile "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Pull and restart application
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOMAIN: ${{ secrets.DOMAIN }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
          PLAN_INITIAL_PRICE_ARS: ${{ secrets.PLAN_INITIAL_PRICE_ARS }}
          PLAN_PROFESSIONAL_PRICE_ARS: ${{ secrets.PLAN_PROFESSIONAL_PRICE_ARS }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          MERCADOPAGO_SANDBOX: ${{ secrets.MERCADOPAGO_SANDBOX }}
          FORMA_CNAME_TARGET: ${{ secrets.FORMA_CNAME_TARGET }}
          TRUST_PROXY_HEADERS: ${{ secrets.TRUST_PROXY_HEADERS }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "umask 077 && cat > '$DEPLOY_PATH/.env'" <<EOF
          IMAGE_NAME=${IMAGE_NAME}:main
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DOMAIN=$DOMAIN
          PUBLIC_URL=$PUBLIC_URL
          COOKIE_SECURE=$COOKIE_SECURE
          PAYLOAD_SECRET=$PAYLOAD_SECRET
          PLATFORM_ADMIN_EMAILS=$PLATFORM_ADMIN_EMAILS
          PLAN_INITIAL_PRICE_ARS=$PLAN_INITIAL_PRICE_ARS
          PLAN_PROFESSIONAL_PRICE_ARS=$PLAN_PROFESSIONAL_PRICE_ARS
          MERCADOPAGO_ACCESS_TOKEN=$MERCADOPAGO_ACCESS_TOKEN
          MERCADOPAGO_WEBHOOK_SECRET=$MERCADOPAGO_WEBHOOK_SECRET
          MERCADOPAGO_SANDBOX=$MERCADOPAGO_SANDBOX
          FORMA_CNAME_TARGET=$FORMA_CNAME_TARGET
          TRUST_PROXY_HEADERS=$TRUST_PROXY_HEADERS
          EOF
          printf '%s' "$GHCR_TOKEN" | ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
           ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && docker compose -f compose.production.yaml pull && docker compose -f compose.production.yaml --profile tools pull && docker compose -f compose.production.yaml --profile tools run --rm migrate && docker compose -f compose.production.yaml up -d --remove-orphans && docker image prune -f"
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "docker logout ghcr.io"
